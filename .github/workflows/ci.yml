name: CI for Base Contracts with Docker

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: docker build -t base-contracts .
      - name: Run tests in Docker
        run: docker run base-contracts npm run test:hardhat
      - name: Run Foundry tests
        run: docker run base-contracts forge test
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: echo "Simulated deploy to Base using Docker"
