services:
  dev:
    build: .
    volumes:
      - .:/app
    ports:
      - "8545:8545"
    command: anvil --host 0.0.0.0  # Local Base-like chain simulation

  test:
    build: .
    command: npm run test:foundry
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: anvil --host 0.0.0.0 --chain-id 8453  # Simulate Base
    ports:
      - "8545:8545"
